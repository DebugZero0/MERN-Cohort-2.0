<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>
    <header>
        <div class="logo">ApexKicks</div>
        <div class="navbar">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </div>
        <div class="search">
            <div class="cart">
                <div class="back">
                    <i class="ri-shopping-bag-3-line" style="color: white;"></i>
                </div>
                cart
            </div>
        </div>
    </header>
    <main>
        <div class="text">
            <p>
                welcome to ApexKicks
            </p>
        </div>
        <div class="info">
            <h1>
                Step into Style with ApexKicks
            </h1>
            <p id="description"></p>
            <div class="stars">
                <i class="ri-star-fill"></i>
                <i class="ri-star-fill"></i>
                <i class="ri-star-fill"></i>
                <i class="ri-star-fill"></i>
                <i class="ri-star-half-line"></i>
            </div>
        </div>
        <div class="colors">
            <p>colors</p>
            <div class="color">
                <div class="circle" style="background-color: #C5FF53;"></div>
                <div class="circle" style="background-color: #6AD5CF;"></div>
                <div class="circle" style="background-color: red;"></div>
                <div class="circle" style="background-color: #AF42AE;"></div>
                <div class="circle" style="background-color: white;"></div>
                <div class="circle" style="background-color: black;"></div>
            </div>
        </div>
        <div class="size">
            <p>sizes that are available</p>
            <div class="size-box">
                <div class="ms">S</div>
                <div class="ms">M</div>
                <div class="ms">L</div>
                <div class="ms">XL</div>
                <div class="ms">2XL</div>
            </div>
        </div>
    </main>
    <div class="design"></div>
    <div class="shoe"></div>
    <footer>
        <div class="box">
            <div class="of">Explore Now</div>
            <h1>25% off</h1> 
            <p>Our new arrivals</p>
        </div>
        <div class="price">
            <h2 id="price">$120.00</h2>
            <h1 id="price-off">$100.00</h1>
            <div class="tab">
                Buy it now
                <i class="ri-arrow-drop-right-line" style="background-color: white; color: black; height: auto; width: auto; border-radius: 50%;"></i>
            </div>
        </div>
    </footer>
    <script src="script.js"></script>
</body>

</html>
